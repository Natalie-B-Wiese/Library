<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stack">
        <h1 id="turn"></h1>

        <div id="board" class="board">
        </div>

        <button id="restart" class="btn btn--destructive">Restart</button>
    </div>

    <div class="footer">
        <div class="name-fieldset">
            <label for="player1name">Player 1</label>
            <input type="text" data-player-index="0" value="Player 1" placeholder="Player 1" id="player1name">
        </div>

        <div class="name-fieldset">
            <label for="player2name">Player 2</label>
            <input type="text" data-player-index="1" value="Player 2" placeholder="Player 2" id="player2name">
        </div>

    </div>

</body>
<script src="script.js" type="module"></script>
</html>
